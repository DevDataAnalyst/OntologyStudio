# Ontology Studio theme
#
# Light ([theme.light]) and dark ([theme.dark]) themes built from one corporate colour palette and type
# system. Because both sections are defined, users can switch between them in the app menu
# (Settings -> Theme: Light / Dark / Use system setting).
#
# Colour
#   Core palette (favoured everywhere): red #ED1C24, black #000000, white #FFFFFF.
#   Extended palette (secondary accents only): Port Blue #2B415C, Steel Blue #557192, Azure Blue #0088A8,
#   Grain Gold #D89F3A, Forest Green #809C66, Petroleum Black #303030, Mineral Grey #7B7B7B,
#   Aluminum Grey #ABABAB, plus their tints (e.g. #21262B, #035C7A, #54B8D9, #D4D6D6, #4F5254, #618045,
#   #B08137, #FFCF6B).
#   Red is the single accent (buttons, selected states, focus) and is never tinted toward pink or burgundy.
#   Dark mode leans on black the way the palette's colour balance does (mostly black, some red, a little
#   white). Text/background pairs meet WCAG AA contrast.
#
# Type
#   Headings: Raleway (bold / semibold).  Body: Roboto.  Code: Roboto Mono (same family as the body).
#   The fonts are self-hosted in static/fonts (SIL Open Font License), so nothing loads from a font CDN.

[server]
enableStaticServing = true

# ---------------------------------------------------------------- options shared by both themes
[theme]
showSidebarBorder = true
font = "Roboto, Arial, sans-serif"
headingFont = "Raleway, Roboto, Arial, sans-serif"
codeFont = "'Roboto Mono', monospace"

[[theme.fontFaces]]
family = "Roboto"
url = "app/static/fonts/roboto-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Roboto"
url = "app/static/fonts/roboto-latin-wght-italic.woff2"
weight = "100 900"
style = "italic"

[[theme.fontFaces]]
family = "Raleway"
url = "app/static/fonts/raleway-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Raleway"
url = "app/static/fonts/raleway-latin-wght-italic.woff2"
weight = "100 900"
style = "italic"

[[theme.fontFaces]]
family = "Roboto Mono"
url = "app/static/fonts/roboto-mono-latin-wght-normal.woff2"
weight = "100 700"
style = "normal"

# ---------------------------------------------------------------- light: red on white
[theme.light]
primaryColor = "#ed1c24"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f3f3"
textColor = "#21262b"
linkColor = "#035c7a"
borderColor = "#d4d6d6"
showWidgetBorder = true
baseRadius = "0.5rem"
buttonRadius = "full"
font = "Roboto, Arial, sans-serif"
headingFont = "Raleway, Roboto, Arial, sans-serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
headingFontSizes = ["3rem", "2rem"]
codeFont = "'Roboto Mono', monospace"
codeFontSize = ".8rem"
codeBackgroundColor = "#f2f3f3"
codeTextColor = "#035c7a"
redColor = "#ed1c24"
orangeColor = "#b08137"
yellowColor = "#d89f3a"
greenColor = "#618045"
blueColor = "#0088a8"
grayColor = "#7b7b7b"
chartCategoricalColors = ["#ed1c24", "#2b415c", "#0088a8", "#d89f3a", "#809c66", "#7b7b7b", "#557192"]

[theme.light.sidebar]
backgroundColor = "#f2f3f3"
secondaryBackgroundColor = "#e6e8e8"
borderColor = "#d4d6d6"
headingFontSizes = ["1.6rem", "1.4rem", "1.2rem"]
dataframeHeaderBackgroundColor = "#e6e8e8"

# ---------------------------------------------------------------- dark: white and red on black
[theme.dark]
primaryColor = "#ed1c24"
backgroundColor = "#21262b"
secondaryBackgroundColor = "#000000"
codeBackgroundColor = "#000000"
textColor = "#ffffff"
linkColor = "#54b8d9"
borderColor = "#4f5254"
showWidgetBorder = true
baseRadius = "0.5rem"
buttonRadius = "full"
font = "Roboto, Arial, sans-serif"
headingFont = "Raleway, Roboto, Arial, sans-serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
headingFontSizes = ["3rem", "2.5rem", "2.25rem", "2rem", "1.5rem"]
codeFont = "'Roboto Mono', monospace"
codeFontSize = ".8rem"
codeTextColor = "#a8dbed"
redColor = "#ed1c24"
orangeColor = "#d89f3a"
yellowColor = "#ffcf6b"
greenColor = "#809c66"
blueColor = "#54b8d9"
grayColor = "#ababab"
chartCategoricalColors = ["#ed1c24", "#54b8d9", "#d89f3a", "#809c66", "#829ebf", "#ababab", "#ffcf6b"]

[theme.dark.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#21262b"
codeBackgroundColor = "#21262b"
borderColor = "#4f5254"
