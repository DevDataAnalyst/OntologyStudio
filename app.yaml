command: ["streamlit", "run", "app.py"]

env:
  # SQL Warehouse used for Unity Catalog browsing, profiling, discovery, lineage, deploys and the Genie space.
  # Add it as an app resource with ON-BEHALF-OF-USER authorization. User authorization scopes: sql, files,
  # and genie (to create / update the Genie space from Publish → Deploy).
  - name: SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Foundation Model endpoint for AI descriptions, Ask and the test set (resource, CAN_QUERY).
  - name: FM_ENDPOINT_NAME
    value: "databricks-meta-llama-3-3-70b-instruct"
  # Pre-selected catalog / schema in the picker (optional)
  - name: TARGET_CATALOG
    value: "main"
  - name: TARGET_SCHEMA
    value: "default"
  # Unity Catalog Volume for versioned semantic models (Publish → Save & versions). Empty = versioning off.
  # Grant the app's service principal READ VOLUME and WRITE VOLUME on it.
  - name: ONTOLOGY_STORE
    value: "/Volumes/main/ontology/store"
  - name: STREAMLIT_SERVER_MAX_UPLOAD_SIZE
    value: "500"
  # Delta table (catalog.schema.table) for Ask traces and feedback (optional; empty = session only)
  - name: TELEMETRY_TABLE
    value: ""
