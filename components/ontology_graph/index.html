<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ontology network</title>
<script src="./d3.v7.min.js"></script>
<style>
  :root { --bg:#ffffff; --fg:#1f2430; --muted:#6b7280; --line:#d6dae1; --panel:#f6f7f9; --accent:#2563eb;
          --chip:#eef2ff; }
  .dark { --bg:#0e1117; --fg:#e6e8eb; --muted:#9aa3ae; --line:#2c323c; --panel:#161a22; --accent:#60a5fa;
          --chip:#1e2433; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--fg);
               font-family:"Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif; font-size:13px; }
  #wrap { display:flex; flex-direction:column; border:1px solid var(--line); border-radius:12px; overflow:hidden;
          background:var(--bg); }
  #wrap:fullscreen { border-radius:0; }
  #bar { display:flex; flex-wrap:wrap; align-items:center; gap:5px 6px; padding:6px 8px; background:var(--panel);
         border-bottom:1px solid var(--line); }
  #bar .grp { display:flex; flex-wrap:nowrap; gap:4px; align-items:center; padding-right:8px;
               border-right:1px solid var(--line); }
  #bar .grp:last-child { border-right:none; }
  button, select { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line);
                   border-radius:7px; padding:3px 9px; cursor:pointer; white-space:nowrap; }
  button:hover:not(:disabled), select:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  button.icon { padding:3px 7px; min-width:28px; }
  label.tg { display:flex; gap:3px; align-items:center; color:var(--muted); cursor:pointer; user-select:none; }
  input[type=search] { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line);
                       border-radius:7px; padding:3px 8px; width:118px; }
  #hits { color:var(--muted); min-width:44px; }
  #stage { flex:1; position:relative; overflow:hidden; }
  #stage svg#graph { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #status { position:absolute; left:10px; top:8px; z-index:5; background:var(--panel); color:var(--fg);
            border:1px solid var(--line); border-radius:8px; padding:3px 9px; max-width:66%; pointer-events:none;
            box-shadow:0 1px 3px rgba(0,0,0,.08); }
  #legend { position:absolute; right:10px; bottom:8px; z-index:5; background:var(--panel); border:1px solid var(--line);
            border-radius:8px; padding:5px 9px; color:var(--muted); line-height:1.75; font-size:12px; }
  #legend .row { display:flex; flex-wrap:wrap; align-items:center; gap:2px 10px; }
  #legend .sw { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  #legend svg { vertical-align:middle; margin-right:3px; }
  #legend .hd { cursor:pointer; color:var(--fg); font-weight:600; user-select:none; }
  #legend.min .body { display:none; }
  #mini { position:absolute; left:10px; bottom:8px; z-index:5; width:168px; height:106px; background:var(--panel);
          border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:crosshair; }
  #mini.hide { display:none; }
  #tip { position:absolute; z-index:10; pointer-events:none; background:var(--panel); color:var(--fg);
         border:1px solid var(--line); border-radius:9px; padding:8px 10px; max-width:320px; font-size:12px;
         box-shadow:0 6px 22px rgba(0,0,0,.18); opacity:0; transition:opacity .12s; line-height:1.45; }
  #tip.show { opacity:1; }
  #tip .t { font-weight:700; font-size:13px; }
  #tip .m { color:var(--muted); }
  #tip .chips { margin-top:4px; display:flex; flex-wrap:wrap; gap:3px; }
  #tip .chip { background:var(--chip); border-radius:5px; padding:0 5px; }
  #tip .cols { margin-top:5px; columns:2; column-gap:12px; }
  #tip .cols div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
  #empty { position:absolute; inset:0; display:none; align-items:center; justify-content:center; color:var(--muted); }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <div class="grp">
      <button id="mSelect" class="on" title="Select, drag and inspect (Esc)">Select</button>
      <button id="mConnect" title="Drag from a class to the class it points to, or click both (C)">＋ Connect</button>
    </div>
    <div class="grp">
      <button id="bRepT" disabled title="Select a relationship, then click its new target class">Repoint target</button>
      <button id="bRepS" disabled title="Select a relationship, then click its new source class">Repoint source</button>
      <button id="bDel" disabled title="Delete the selected relationship (Del)">Delete</button>
      <button id="bAcc" disabled title="Accept the selected suggestion">✓ Accept</button>
      <button id="bRej" disabled title="Reject the selected suggestion">✕ Reject</button>
    </div>
    <div class="grp">
      <select id="layout" title="Layout style">
        <option value="force" title="Organic force-directed layout">Force</option>
        <option value="layered" title="Facts on the left, dimensions to the right">Layered</option>
        <option value="radial" title="Facts in the centre, dimensions around them">Radial</option>
      </select>
      <button id="bLayout" title="Re-run the layout (L)">Re-layout</button>
      <button id="bFit" title="Fit to screen (F)">Fit</button>
      <button id="bOut" class="icon" title="Zoom out">−</button>
      <button id="bIn" class="icon" title="Zoom in">+</button>
      <button id="bFull" class="icon" title="Full screen">⛶</button>
    </div>
    <div class="grp">
      <input id="q" type="search" placeholder="Find class… (/)" />
      <span id="hits"></span>
    </div>
    <div class="grp">
      <label class="tg"><input type="checkbox" id="tRel" checked />Relationships</label>
      <label class="tg"><input type="checkbox" id="tSug" checked />Suggestions</label>
      <label class="tg"><input type="checkbox" id="tLin" checked />Lineage</label>
      <label class="tg"><input type="checkbox" id="tLbl" checked />Labels</label>
      <label class="tg"><input type="checkbox" id="tMini" checked />Map</label>
    </div>
    <div class="grp">
      <button id="bSvg" title="Download the diagram as SVG">SVG</button>
      <button id="bPng" title="Download the diagram as PNG">PNG</button>
    </div>
  </div>
  <div id="stage">
    <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="status">Ready</div>
    <svg id="mini"></svg>
    <div id="legend">
      <div class="hd" id="legHd">Legend ▾</div>
      <div class="body">
        <div class="row">
          <span><span class="sw" style="background:#f59e0b"></span>Fact</span>
          <span><span class="sw" style="background:#3b82f6"></span>Dimension</span>
          <span><span class="sw" style="background:#64748b"></span>Entity</span>
          <span><span class="sw" style="background:#8b5cf6"></span>Bridge</span>
          <span><span class="sw" style="background:transparent;border:1px dashed #94a3b8"></span>External</span>
        </div>
        <div class="row">
          <span><svg width="34" height="12"><path d="M2 6H32M10 1L2 6L10 11M30 1V11" stroke="currentColor" fill="none" stroke-width="1.4"/></svg>many-to-one</span>
          <span><svg width="34" height="12"><path d="M2 6H32M4 1V11M30 1V11" stroke="currentColor" fill="none" stroke-width="1.4"/></svg>one-to-one</span>
          <span><svg width="34" height="12"><path d="M2 6H32M10 1L2 6L10 11M24 1L32 6L24 11" stroke="currentColor" fill="none" stroke-width="1.4"/></svg>many-to-many</span>
        </div>
        <div class="row">
          <span><svg width="30" height="12"><path d="M2 6H28" stroke="#f97316" stroke-dasharray="5 4" stroke-width="2"/></svg>suggested</span>
          <span><svg width="30" height="12"><path d="M2 6H28" stroke="#10b981" stroke-dasharray="2 4" stroke-width="2.2" stroke-linecap="round"/></svg>lineage</span>
        </div>
      </div>
    </div>
    <div id="tip"></div>
    <div id="empty">No classes to show yet.</div>
  </div>
</div>

<script>
(function () {
  "use strict";
  // ------------------------------------------------------------------ Streamlit protocol
  function post(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }
  let counter = 0;
  function send(evt) {
    evt.nonce = Date.now() + "-" + (counter++);
    post("streamlit:setComponentValue", { value: evt, dataType: "json" });
  }

  // ------------------------------------------------------------------ constants
  const ROLE = {
    fact:      { color: "#f59e0b", glyph: "F", label: "fact" },
    dimension: { color: "#3b82f6", glyph: "D", label: "dimension" },
    entity:    { color: "#64748b", glyph: "E", label: "entity" },
    bridge:    { color: "#8b5cf6", glyph: "B", label: "bridge" },
    external:  { color: "#94a3b8", glyph: "↗", label: "external" }
  };
  const PALETTE = {
    light: { bg: "#ffffff", card: "#ffffff", cardLine: "#d5dbe5", text: "#1f2430", sub: "#6b7280", edge: "#7c8796",
             grid: "#e6eaf0", accent: "#2563eb", sel: "#ef4444", hit: "#eab308", sug: "#f97316", lin: "#10b981",
             label: "#ffffff", labelLine: "#dfe3ea", shadow: "rgba(15,23,42,0.14)", connect: "#22c55e" },
    dark:  { bg: "#0e1117", card: "#1a1f29", cardLine: "#323b4c", text: "#e6e8eb", sub: "#9aa3ae", edge: "#8d99ab",
             grid: "#1a1f29", accent: "#60a5fa", sel: "#f87171", hit: "#facc15", sug: "#fb923c", lin: "#34d399",
             label: "#161a22", labelLine: "#2c323c", shadow: "rgba(0,0,0,0.55)", connect: "#4ade80" }
  };
  const FONT = '"Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif';
  const $ = (id) => document.getElementById(id);

  // ------------------------------------------------------------------ state
  const st = {
    nodes: [], links: [], byId: new Map(), mode: "select", pendingSource: null, sel: null, hoverId: null,
    layout: "force", dark: false, height: 640, first: true, query: "", hits: [], laidOut: false,
    relayoutRequested: false, settling: false
  };
  let svg, root, gGrid, gLinks, gLabels, gNodes, rubber, defs, styleEl, zoom, sim;
  let transform = d3.zoomIdentity;
  let mini, miniRoot, miniView, miniScale = { k: 1, x: 0, y: 0 };
  const measureCtx = document.createElement("canvas").getContext("2d");

  function status(t) { $("status").textContent = t; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtCount(n) {
    if (n == null || isNaN(n)) return null;
    n = Number(n);
    if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "K";
    return String(n);
  }
  function textWidth(t, weight, size) {
    measureCtx.font = (weight || 400) + " " + (size || 13) + "px " + FONT;
    return measureCtx.measureText(t).width;
  }
  function truncate(t, max) { return t.length > max ? t.slice(0, max - 1) + "…" : t; }

  // ------------------------------------------------------------------ styles (live inside the SVG, so exports keep them)
  function svgCss(dark) {
    const p = dark ? PALETTE.dark : PALETTE.light;
    return `
      .card { fill:${p.card}; stroke:${p.cardLine}; stroke-width:1.2; }
      .node.external .card { fill:none; stroke:${PALETTE.light.sub}; stroke-dasharray:4 3; }
      .node .title { font: 600 13px ${FONT}; fill:${p.text}; }
      .node .sub { font: 400 11px ${FONT}; fill:${p.sub}; }
      .node.external .title { font-style:italic; font-weight:400; fill:${p.sub}; }
      .node .glyph { font: 700 11px ${FONT}; fill:#ffffff; text-anchor:middle; dominant-baseline:central; }
      .node .ring { fill:none; stroke:none; stroke-width:2.5; }
      .node.sel .ring { stroke:${p.sel}; }
      .node.hit .ring { stroke:${p.hit}; stroke-width:3.5; }
      .node.pending .ring { stroke:${p.connect}; stroke-dasharray:6 4; stroke-width:3; animation: dash 0.8s linear infinite; }
      .node { cursor:pointer; transition: opacity .15s; }
      .node.dim, .link.dim, .elabel.dim { opacity:0.14; }
      .link { fill:none; stroke-linecap:round; transition: opacity .15s; }
      .link.rel { stroke:${p.edge}; stroke-width:1.7; }
      .link.sug { stroke:${p.sug}; stroke-width:1.8; stroke-dasharray:7 5; }
      .link.lin { stroke:${p.lin}; stroke-width:2.1; stroke-dasharray:2 6; animation: flow 1.1s linear infinite; }
      .link.hl { stroke:${p.accent}; stroke-width:2.4; }
      .link.sel { stroke:${p.sel}; stroke-width:3; }
      .hitpath { fill:none; stroke:transparent; stroke-width:14; cursor:pointer; }
      .elabel rect { fill:${p.label}; stroke:${p.labelLine}; stroke-width:1; }
      .elabel text { font: 400 10.5px ${FONT}; fill:${p.sub}; dominant-baseline:central; text-anchor:middle; }
      .elabel.sug text { fill:${p.sug}; }
      .elabel.lin text { fill:${p.lin}; }
      .elabel.sel rect { stroke:${p.sel}; }
      .elabel.sel text, .elabel.hl text { fill:${p.text}; font-weight:600; }
      .elabel { pointer-events:none; transition: opacity .15s; }
      .rubber { stroke:${p.connect}; stroke-width:2; stroke-dasharray:6 4; fill:none; pointer-events:none; }
      .gridDot { fill:${p.grid}; }
      @keyframes flow { to { stroke-dashoffset: -16; } }
      @keyframes dash { to { stroke-dashoffset: -20; } }
    `;
  }

  // ------------------------------------------------------------------ markers: crow's foot (many), bar (one), arrow
  const MARK_COLORS = () => {
    const p = st.dark ? PALETTE.dark : PALETTE.light;
    return { edge: p.edge, hl: p.accent, sel: p.sel, sug: p.sug, lin: p.lin };
  };
  function buildMarkers() {
    defs.selectAll("marker").remove();
    const shapes = {
      many: { d: "M-14,0L0,-6.5M-14,0L0,0M-14,0L0,6.5", fill: "none" },
      one: { d: "M-8,-6V6M-13,0H0", fill: "none" },
      arrow: { d: "M-11,-5L0,0L-11,5Z", fill: "solid" }
    };
    Object.entries(MARK_COLORS()).forEach(([cname, color]) => {
      Object.entries(shapes).forEach(([sname, s]) => {
        defs.append("marker").attr("id", `m-${sname}-${cname}`).attr("viewBox", "-15 -8 16 16")
          .attr("refX", 0).attr("refY", 0).attr("markerWidth", 16).attr("markerHeight", 16)
          .attr("markerUnits", "userSpaceOnUse").attr("orient", "auto-start-reverse")
          .append("path").attr("d", s.d).attr("stroke", color).attr("stroke-width", 1.6)
          .attr("stroke-linejoin", "round").attr("fill", s.fill === "solid" ? color : "none");
      });
    });
  }
  function markerColor(l) {
    if (st.sel && st.sel.type === "link" && st.sel.id === l.id) return "sel";
    if (l._hl) return "hl";
    return l.kind === "rel" ? "edge" : l.kind;
  }
  function markerStart(l) {
    if (l.kind !== "rel") return null;
    return (l.card === "N:1" || l.card === "N:M") ? `url(#m-many-${markerColor(l)})` : `url(#m-one-${markerColor(l)})`;
  }
  function markerEnd(l) {
    if (l.kind !== "rel") return `url(#m-arrow-${markerColor(l)})`;
    return l.card === "N:M" ? `url(#m-many-${markerColor(l)})` : `url(#m-one-${markerColor(l)})`;
  }

  // ------------------------------------------------------------------ geometry
  function size(n) {
    if (n.role === "external") {
      n.title = truncate(n.label || n.id, 30);
      n.w = Math.max(70, textWidth(n.title, 400, 13) + 26);
      n.h = 26;
      return;
    }
    n.title = truncate(n.label || n.id, 30);
    const parts = [ROLE[n.role] ? ROLE[n.role].label : (n.role || "entity")];
    const rows = fmtCount(n.rows);
    if (rows) parts.push(rows + " rows");
    if (n.cols != null) parts.push(n.cols + " cols");
    if (n.measures) parts.push("Σ " + n.measures);
    n.subtitle = parts.join(" · ");
    const w = Math.max(textWidth(n.title, 600, 13), textWidth(n.subtitle, 400, 11));
    n.w = Math.min(280, Math.max(128, w + 50));
    n.h = n.role === "fact" ? 50 : 44;
  }
  // point on the border of node n's box, in the direction of (tx, ty)
  function boxPoint(n, tx, ty, pad) {
    pad = pad || 3;
    const dx = tx - n.x, dy = ty - n.y;
    const hw = n.w / 2 + pad, hh = n.h / 2 + pad;
    if (dx === 0 && dy === 0) return { x: n.x, y: n.y };
    const s = Math.min(hw / Math.abs(dx || 1e-9), hh / Math.abs(dy || 1e-9));
    return { x: n.x + dx * s, y: n.y + dy * s };
  }
  function linkGeometry(l) {
    const a = l.source, b = l.target;
    if (!a || !b || a.x == null || b.x == null) return null;
    if (a === b) {                                       // self-reference: loop over the top-right corner
      const x0 = a.x + a.w * 0.18, y0 = a.y - a.h / 2 - 2, x1 = a.x + a.w / 2 + 2, y1 = a.y - a.h * 0.1;
      const r = 34 + 14 * (l._k || 0);
      return { d: `M${x0},${y0} C${x0},${y0 - r} ${x1 + r},${y1} ${x1},${y1}`,
               mx: (x0 + x1) / 2 + r * 0.55, my: (y0 + y1) / 2 - r * 0.55 };
    }
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    const off = l._off || 0;
    const cx = (a.x + b.x) / 2 - dy / len * off, cy = (a.y + b.y) / 2 + dx / len * off;
    const p0 = boxPoint(a, off ? cx : b.x, off ? cy : b.y), p2 = boxPoint(b, off ? cx : a.x, off ? cy : a.y);
    if (!off) return { d: `M${p0.x},${p0.y}L${p2.x},${p2.y}`, mx: (p0.x + p2.x) / 2, my: (p0.y + p2.y) / 2 };
    return { d: `M${p0.x},${p0.y}Q${cx},${cy} ${p2.x},${p2.y}`,
             mx: 0.25 * p0.x + 0.5 * cx + 0.25 * p2.x, my: 0.25 * p0.y + 0.5 * cy + 0.25 * p2.y };
  }
  function computeOffsets() {
    const groups = new Map();
    st.links.forEach((l) => {
      const a = l.s, b = l.t;
      const key = a < b ? a + "\u0000" + b : b + "\u0000" + a;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(l);
    });
    groups.forEach((ls) => {
      ls.forEach((l, i) => {
        l._k = i;
        if (l.s === l.t) { l._off = 0; return; }
        if (ls.length === 1) { l._off = 0; return; }
        const sign = l.s < l.t ? 1 : -1;               // same side for both directions
        l._off = sign * (i - (ls.length - 1) / 2) * 34;
      });
    });
  }
  // layers for layered / radial layouts: facts at 0, then along many-to-one relationships
  function computeLayers() {
    const out = new Map(), adj = new Map();
    st.nodes.forEach((n) => { adj.set(n.id, []); });
    st.links.forEach((l) => { if (l.kind === "rel" && l.s !== l.t) { adj.get(l.s).push(l.t); } });
    const indeg = new Map(st.nodes.map((n) => [n.id, 0]));
    st.links.forEach((l) => { if (l.kind === "rel" && l.s !== l.t) indeg.set(l.t, indeg.get(l.t) + 1); });
    let frontier = st.nodes.filter((n) => n.role === "fact").map((n) => n.id);
    if (!frontier.length) frontier = st.nodes.filter((n) => indeg.get(n.id) === 0 && n.role !== "external").map((n) => n.id);
    frontier.forEach((id) => out.set(id, 0));
    while (frontier.length) {
      const next = [];
      frontier.forEach((id) => (adj.get(id) || []).forEach((t) => {
        if (!out.has(t)) { out.set(t, out.get(id) + 1); next.push(t); }
      }));
      frontier = next;
    }
    const maxL = Math.max(0, ...out.values());
    st.nodes.forEach((n) => { n.layer = out.has(n.id) ? out.get(n.id) : (n.role === "external" ? maxL + 1 : maxL + 1); });
  }

  // ------------------------------------------------------------------ simulation
  function forces() {
    const n = st.nodes.length;
    const charge = -420 - Math.min(520, n * 6);
    sim.force("link", d3.forceLink(st.links.filter(visibleLink)).id((d) => d.id)
      .distance((l) => ((l.source.w || 120) + (l.target.w || 120)) / 2 + (l.kind === "lin" ? 150 : 125))
      .strength((l) => (l.kind === "rel" ? 0.55 : l.kind === "lin" ? 0.25 : 0.18)));
    sim.force("charge", d3.forceManyBody().strength(charge).distanceMax(1100));
    sim.force("collide", d3.forceCollide((d) => d.w / 2 + 26).strength(0.95).iterations(3));
    if (st.layout === "layered") {
      sim.force("x", d3.forceX((d) => d.layer * 300).strength(0.65));
      sim.force("y", d3.forceY(0).strength(0.05));
      sim.force("radial", null);
    } else if (st.layout === "radial") {
      sim.force("x", d3.forceX(0).strength(0.02));
      sim.force("y", d3.forceY(0).strength(0.02));
      sim.force("radial", d3.forceRadial((d) => d.layer * 250, 0, 0).strength(0.85));
    } else {
      sim.force("x", d3.forceX(0).strength(0.04));
      sim.force("y", d3.forceY(0).strength(0.055));
      sim.force("radial", null);
    }
  }
  // The force simulation is used as a layout engine: it runs synchronously (fast, and immune to
  // the animation-frame throttling of hidden or embedded frames), then nodes glide into place.
  function snapshot() { return new Map(st.nodes.map((n) => [n.id, { x: n.x, y: n.y }])); }
  function runTicks(alpha, decay, maxTicks) {
    sim.stop();
    sim.alpha(alpha).alphaDecay(decay);
    const n = Math.min(maxTicks, Math.ceil(Math.log(sim.alphaMin() / alpha) / Math.log(1 - decay)));
    for (let i = 0; i < n; ++i) sim.tick();
  }
  function relayout(fit, instantView) {
    computeLayers();
    const from = snapshot();
    st.nodes.forEach((n) => {
      n.fx = null; n.fy = null;
      if (n.x == null || isNaN(n.x) || st.layout !== "force") {
        // seed positions so the chosen layout converges quickly
        const a = Math.random() * Math.PI * 2;
        n.x = st.layout === "layered" ? n.layer * 300 + (Math.random() - 0.5) * 60 : Math.cos(a) * (n.layer * 250 + 40);
        n.y = st.layout === "layered" ? (Math.random() - 0.5) * 400 : Math.sin(a) * (n.layer * 250 + 40);
      }
    });
    forces();
    runTicks(1, 0.028, 600);
    finishLayout(from, fit !== false, instantView, "Layout done · drag classes to fine-tune");
  }
  function settleNew() {        // new classes find a place; existing ones stay pinned
    const from = snapshot();
    forces();
    runTicks(0.6, 0.05, 200);
    finishLayout(from, false, false, null);
  }
  function finishLayout(from, fit, instantView, msg) {
    const to = snapshot();
    st.nodes.forEach((n) => { n.fx = n.x; n.fy = n.y; });
    sendPositions();
    if (fit) fitView(!instantView);
    if (msg) status(msg);
    animateFrom(from, to, 700);
  }
  let anim = null;
  function animateFrom(from, to, ms) {
    if (anim) anim.stop();
    const movers = st.nodes.filter((n) => { const a = from.get(n.id), b = to.get(n.id);
      return a && b && a.x != null && !isNaN(a.x) && (Math.abs(a.x - b.x) > 1 || Math.abs(a.y - b.y) > 1); });
    if (!movers.length) { ticked(); return; }
    const ease = d3.easeCubicInOut;
    const step = (k) => {
      movers.forEach((n) => {
        const a = from.get(n.id), b = to.get(n.id);
        n.x = n.fx = a.x + (b.x - a.x) * k; n.y = n.fy = a.y + (b.y - a.y) * k;
      });
      ticked();
    };
    step(0);
    anim = d3.timer((elapsed) => {
      const k = Math.min(1, elapsed / ms);
      step(ease(k));
      if (k >= 1) { anim.stop(); anim = null; drawMini(); }
    });
  }

  // ------------------------------------------------------------------ positions back to Python
  let posTimer = null;
  function sendPositions() {
    clearTimeout(posTimer);
    posTimer = setTimeout(() => {
      const out = {};
      st.nodes.forEach((n) => { if (n.x != null) out[n.id] = { x: Math.round(n.x), y: Math.round(n.y) }; });
      send({ type: "positions", positions: out });
    }, 400);
  }

  // ------------------------------------------------------------------ drawing
  function visibleLink(l) {
    return l.kind === "rel" ? $("tRel").checked : l.kind === "sug" ? $("tSug").checked : $("tLin").checked;
  }
  function visibleNode(n) { return n.role !== "external" || $("tLin").checked; }

  function draw() {
    const vis = st.links.filter(visibleLink);
    // links
    const lk = gLinks.selectAll("g.lk").data(vis, (d) => d.id);
    lk.exit().remove();
    const lkEnter = lk.enter().append("g").attr("class", "lk");
    lkEnter.append("path").attr("class", "link");
    lkEnter.append("path").attr("class", "hitpath");
    const lkAll = lkEnter.merge(lk);
    lkAll.select("path.link").attr("class", (d) => "link " + d.kind);       // select() re-binds fresh data
    lkAll.select("path.hitpath")
      .on("click", (ev, d) => { ev.stopPropagation(); clickLink(d); })
      .on("mouseenter", (ev, d) => { hoverLink(d, true); showTip(ev, linkTip(d)); })
      .on("mousemove", (ev) => moveTip(ev))
      .on("mouseleave", (ev, d) => { hoverLink(d, false); hideTip(); });
    // labels
    const lb = gLabels.selectAll("g.elabel").data(vis, (d) => d.id);
    lb.exit().remove();
    const lbEnter = lb.enter().append("g").attr("class", "elabel");
    lbEnter.append("rect").attr("rx", 6).attr("ry", 6);
    lbEnter.append("text");
    lbEnter.merge(lb).attr("class", (d) => "elabel " + d.kind)
      .each(function (d) {
        const g = d3.select(this), t = d.label || "";
        g.select("text").text(t);
        const w = textWidth(t, 400, 10.5) + 12;
        d._lw = w;
        g.select("rect").attr("x", -w / 2).attr("y", -9).attr("width", w).attr("height", 18);
      });
    // nodes
    const nv = st.nodes.filter(visibleNode);
    const nd = gNodes.selectAll("g.node").data(nv, (d) => d.id);
    nd.exit().remove();
    const ne = nd.enter().append("g").attr("class", "node").call(dragBehaviour())
      .on("click", (ev, d) => { ev.stopPropagation(); clickNode(d); })
      .on("dblclick", (ev, d) => { ev.stopPropagation(); focusNode(d); })
      .on("mouseenter", (ev, d) => { hoverNode(d.id); showTip(ev, nodeTip(d)); })
      .on("mousemove", (ev) => moveTip(ev))
      .on("mouseleave", () => { hoverNode(null); hideTip(); });
    ne.append("rect").attr("class", "ring");
    ne.append("rect").attr("class", "card");
    ne.append("circle").attr("class", "badge");
    ne.append("text").attr("class", "glyph");
    ne.append("text").attr("class", "title");
    ne.append("text").attr("class", "sub");
    ne.merge(nd).each(function (d) {
      const g = d3.select(this);
      const ext = d.role === "external";
      g.classed("external", ext);
      g.select("rect.card").attr("x", -d.w / 2).attr("y", -d.h / 2).attr("width", d.w).attr("height", d.h)
        .attr("rx", ext ? 13 : 10).attr("filter", ext ? null : "url(#shadow)");
      g.select("rect.ring").attr("x", -d.w / 2 - 4).attr("y", -d.h / 2 - 4).attr("width", d.w + 8)
        .attr("height", d.h + 8).attr("rx", ext ? 16 : 13);
      const role = ROLE[d.role] || ROLE.entity;
      g.select("circle.badge").attr("cx", -d.w / 2 + 19).attr("cy", 0).attr("r", ext ? 0 : 11)
        .attr("fill", role.color);
      g.select("text.glyph").attr("x", -d.w / 2 + 19).attr("y", 0.5).text(ext ? "" : role.glyph);
      g.select("text.title").attr("x", ext ? -d.w / 2 + 13 : -d.w / 2 + 38).attr("y", ext ? 0 : -6)
        .attr("dominant-baseline", "central").text(d.title);
      g.select("text.sub").attr("x", -d.w / 2 + 38).attr("y", 11).attr("dominant-baseline", "central")
        .text(ext ? "" : d.subtitle);
    });
    applyClasses();
    ticked();
    $("empty").style.display = st.nodes.length ? "none" : "flex";
  }

  function ticked() {
    gLinks.selectAll("g.lk").each(function (l) {
      const g = d3.select(this), geo = linkGeometry(l);
      if (!geo) return;
      l._mx = geo.mx; l._my = geo.my;
      g.select("path.link").attr("d", geo.d).attr("marker-start", markerStart(l)).attr("marker-end", markerEnd(l));
      g.select("path.hitpath").attr("d", geo.d);
    });
    gLabels.selectAll("g.elabel").attr("transform", (l) => `translate(${l._mx || 0},${l._my || 0})`);
    gNodes.selectAll("g.node").attr("transform", (d) => `translate(${d.x || 0},${d.y || 0})`);
    if (!ticked._raf) {
      ticked._raf = requestAnimationFrame(() => { ticked._raf = null; drawMini(); });
    }
  }

  function applyClasses() {
    const sel = st.sel, hov = st.hoverId, neigh = new Set();
    let hoverLinkId = st.hoverLink || null;
    if (hov) {
      neigh.add(hov);
      st.links.forEach((l) => { if (visibleLink(l) && (l.s === hov || l.t === hov)) { neigh.add(l.s); neigh.add(l.t); } });
    }
    st.links.forEach((l) => { l._hl = !!(hov && (l.s === hov || l.t === hov)) || l.id === hoverLinkId; });
    gNodes.selectAll("g.node")
      .classed("sel", (d) => !!(sel && sel.type === "node" && sel.id === d.id))
      .classed("hit", (d) => st.hits.indexOf(d.id) >= 0)
      .classed("pending", (d) => st.pendingSource === d.id)
      .classed("dim", (d) => !!(hov && !neigh.has(d.id)));
    gLinks.selectAll("g.lk").select("path.link")
      .classed("sel", (l) => !!(sel && sel.type === "link" && sel.id === l.id))
      .classed("hl", (l) => l._hl && !(sel && sel.type === "link" && sel.id === l.id))
      .classed("dim", (l) => !!(hov && !(l.s === hov || l.t === hov)));
    const showLabels = $("tLbl").checked;
    const k = transform.k;
    gLabels.selectAll("g.elabel")
      .classed("sel", (l) => !!(sel && sel.type === "link" && sel.id === l.id))
      .classed("hl", (l) => l._hl)
      .classed("dim", (l) => !!(hov && !(l.s === hov || l.t === hov)))
      .style("display", (l) => {
        const important = l._hl || (sel && sel.type === "link" && sel.id === l.id);
        return (showLabels && (k >= 0.55 || important)) || important ? null : "none";
      });
    gLinks.selectAll("g.lk").select("path.link")
      .attr("marker-start", markerStart).attr("marker-end", markerEnd);
    refreshButtons();
  }

  // ------------------------------------------------------------------ interaction
  function selectedLink() {
    if (!st.sel || st.sel.type !== "link") return null;
    return st.links.find((l) => l.id === st.sel.id) || null;
  }
  function refreshButtons() {
    const l = selectedLink(), k = l ? l.kind : null;
    $("bRepT").disabled = $("bRepS").disabled = $("bDel").disabled = k !== "rel";
    $("bAcc").disabled = $("bRej").disabled = k !== "sug";
  }
  function setMode(m) {
    st.mode = m;
    $("mSelect").classList.toggle("on", m === "select");
    $("mConnect").classList.toggle("on", m === "connect");
    $("bRepT").classList.toggle("on", m === "repoint-target");
    $("bRepS").classList.toggle("on", m === "repoint-source");
    st.pendingSource = null;
    rubber.attr("d", null);
    status({ "select": "Select: drag classes, click to inspect, double-click to focus",
             "connect": "Connect: drag from the class holding the key to the class it points to (or click both)",
             "repoint-target": "Repoint: click the new TARGET class",
             "repoint-source": "Repoint: click the new SOURCE class" }[m]);
    applyClasses();
  }
  function clickNode(d) {
    if (d.role === "external") { status("External table (lineage only): " + (d.full || d.id)); return; }
    if (st.mode === "connect") {
      if (!st.pendingSource) {
        st.pendingSource = d.id; applyClasses();
        status("Connect: now click the class it points to (the one with the key)");
        return;
      }
      const src = st.pendingSource;
      setMode("select");
      send({ type: "connect", source: src, target: d.id });
      status("Creating relationship " + src + " → " + d.id + " …");
      return;
    }
    if (st.mode === "repoint-target" || st.mode === "repoint-source") {
      const l = selectedLink();
      if (l) {
        send({ type: "repoint", edge: l.pid, end: st.mode === "repoint-target" ? "target" : "source", node: d.id });
        status("Repointing " + l.pid + " …");
      }
      setMode("select");
      return;
    }
    st.sel = { type: "node", id: d.id };
    applyClasses();
    send({ type: "select", kind: "node", id: d.id });
  }
  function clickLink(l) {
    if (st.mode !== "select") return;
    st.sel = { type: "link", id: l.id };
    applyClasses();
    send({ type: "select", kind: "edge", id: l.id, edge_kind: l.kind, pid: l.pid || null, sid: l.sid || null });
  }
  function clickBackground() {
    if (st.mode === "connect" && st.pendingSource) { setMode("connect"); return; }
    if (st.mode !== "select") return;
    if (st.sel) {
      st.sel = null; applyClasses();
      send({ type: "select", kind: null, id: null });
    }
  }
  function hoverNode(id) { st.hoverId = id; applyClasses(); }
  function hoverLink(l, on) { st.hoverLink = on ? l.id : null; applyClasses(); }

  function nodeAt(x, y) {      // graph coordinates -> node under the point
    for (let i = st.nodes.length - 1; i >= 0; i--) {
      const n = st.nodes[i];
      if (!visibleNode(n)) continue;
      if (Math.abs(x - n.x) <= n.w / 2 && Math.abs(y - n.y) <= n.h / 2) return n;
    }
    return null;
  }
  function dragBehaviour() {
    return d3.drag()
      .clickDistance(4)
      .on("start", function (ev, d) {
        hideTip();
        if (st.mode === "connect") { st.pendingSource = d.id; applyClasses(); return; }
        if (st.mode !== "select") return;
        d._dragged = false;
        if (anim) { anim.stop(); anim = null; }
        d.fx = d.x; d.fy = d.y;
      })
      .on("drag", function (ev, d) {
        if (st.mode === "connect") {
          const [px, py] = [ev.x, ev.y];
          const p0 = boxPoint(d, px, py);
          rubber.attr("d", `M${p0.x},${p0.y}L${px},${py}`);
          const over = nodeAt(px, py);
          st.hits = over && over.id !== d.id ? [over.id] : [];
          applyClasses();
          return;
        }
        if (st.mode !== "select") return;
        d._dragged = true;
        d.x = d.fx = ev.x; d.y = d.fy = ev.y;
        ticked();
      })
      .on("end", function (ev, d) {
        if (st.mode === "connect") {
          rubber.attr("d", null);
          const over = nodeAt(ev.x, ev.y);
          st.hits = [];
          if (over && over.id !== d.id && over.role !== "external") {
            setMode("select");
            send({ type: "connect", source: d.id, target: over.id });
            status("Creating relationship " + d.id + " → " + over.id + " …");
          } else if (over && over.id === d.id) {
            status("Connect: now click (or drag to) the class it points to");
          } else {
            applyClasses();
          }
          return;
        }
        if (d._dragged) sendPositions();
      });
  }

  // ------------------------------------------------------------------ zoom / view
  function fitView(animate, only) {
    const ns = (only || st.nodes).filter(visibleNode).filter((n) => n.x != null);
    if (!ns.length) return;
    const x0 = d3.min(ns, (n) => n.x - n.w / 2), x1 = d3.max(ns, (n) => n.x + n.w / 2);
    const y0 = d3.min(ns, (n) => n.y - n.h / 2), y1 = d3.max(ns, (n) => n.y + n.h / 2);
    const box = svg.node().getBoundingClientRect();
    const W = box.width || 800, H = box.height || 600;
    const overlays = !$("mini").classList.contains("hide") || !$("legend").classList.contains("min");
    const padX = 40, padTop = 44, padBottom = overlays && H > 360 ? 118 : 40;
    const k = Math.max(0.08, Math.min(1.15, Math.min((W - 2 * padX) / Math.max(1, x1 - x0),
                                                    (H - padTop - padBottom) / Math.max(1, y1 - y0))));
    const cy = padTop + (H - padTop - padBottom) / 2;
    const t = d3.zoomIdentity.translate(W / 2, cy).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
    (animate ? svg.transition().duration(480) : svg).call(zoom.transform, t);
  }
  function focusNode(d) {
    const ids = new Set([d.id]);
    st.links.forEach((l) => { if (visibleLink(l) && (l.s === d.id || l.t === d.id)) { ids.add(l.s); ids.add(l.t); } });
    fitView(true, st.nodes.filter((n) => ids.has(n.id)));
  }
  function zoomed(ev) {
    transform = ev.transform;
    root.attr("transform", transform);
    const g = 24 * transform.k;
    svg.select("#gridPattern").attr("width", g).attr("height", g)
      .attr("patternTransform", `translate(${transform.x % g},${transform.y % g})`);
    svg.select("#gridPattern circle").attr("cx", g / 2).attr("cy", g / 2).attr("r", Math.max(0.6, 1.1 * Math.min(1.4, transform.k)));
    applyClasses();
    drawMini();
  }

  // ------------------------------------------------------------------ minimap
  function drawMini() {
    if (!mini || $("mini").classList.contains("hide")) return;
    const ns = st.nodes.filter(visibleNode).filter((n) => n.x != null);
    if (!ns.length) { miniRoot.selectAll("*").remove(); return; }
    const W = 168, H = 106, pad = 7;
    const x0 = d3.min(ns, (n) => n.x - n.w / 2), x1 = d3.max(ns, (n) => n.x + n.w / 2);
    const y0 = d3.min(ns, (n) => n.y - n.h / 2), y1 = d3.max(ns, (n) => n.y + n.h / 2);
    const k = Math.min((W - 2 * pad) / Math.max(1, x1 - x0), (H - 2 * pad) / Math.max(1, y1 - y0));
    miniScale = { k: k, x: pad - x0 * k + ((W - 2 * pad) - (x1 - x0) * k) / 2, y: pad - y0 * k + ((H - 2 * pad) - (y1 - y0) * k) / 2 };
    const r = miniRoot.selectAll("rect.mn").data(ns, (d) => d.id);
    r.exit().remove();
    r.enter().append("rect").attr("class", "mn").attr("rx", 1.5)
      .merge(r)
      .attr("x", (d) => miniScale.x + (d.x - d.w / 2) * k).attr("y", (d) => miniScale.y + (d.y - d.h / 2) * k)
      .attr("width", (d) => Math.max(2, d.w * k)).attr("height", (d) => Math.max(2, d.h * k))
      .attr("fill", (d) => (ROLE[d.role] || ROLE.entity).color).attr("opacity", (d) => d.role === "external" ? 0.4 : 0.85);
    const vb = svg.node().getBoundingClientRect(), Wv = vb.width, Hv = vb.height;
    const vx0 = (0 - transform.x) / transform.k, vy0 = (0 - transform.y) / transform.k;
    miniView.attr("x", miniScale.x + vx0 * k).attr("y", miniScale.y + vy0 * k)
      .attr("width", Wv / transform.k * k).attr("height", Hv / transform.k * k);
  }
  function miniNavigate(ev) {
    const [mx, my] = d3.pointer(ev, mini.node());
    const gx = (mx - miniScale.x) / miniScale.k, gy = (my - miniScale.y) / miniScale.k;
    const vb = svg.node().getBoundingClientRect(), W = vb.width, H = vb.height;
    svg.call(zoom.transform, d3.zoomIdentity.translate(W / 2 - gx * transform.k, H / 2 - gy * transform.k).scale(transform.k));
  }

  // ------------------------------------------------------------------ tooltips
  function nodeTip(d) {
    if (d.role === "external") {
      return `<div class="t">${esc(d.full || d.id)}</div><div class="m">Table outside the selection, seen in lineage</div>`;
    }
    let h = `<div class="t">${esc(d.id)}</div><div class="m">${esc(d.table || "")}</div>`;
    const chips = [(ROLE[d.role] || ROLE.entity).label];
    if (d.rows != null) chips.push(Number(d.rows).toLocaleString() + " rows");
    if (d.cols != null) chips.push(d.cols + " columns");
    if (d.keys) chips.push(d.keys + " keys");
    if (d.measures) chips.push(d.measures + " measures");
    if (d.times) chips.push(d.times + " time");
    if (d.metrics) chips.push(d.metrics + " metrics");
    h += `<div class="chips">${chips.map((c) => `<span class="chip">${esc(c)}</span>`).join("")}</div>`;
    if (d.desc) h += `<div style="margin-top:5px">${esc(d.desc)}</div>`;
    if (d.columns && d.columns.length) {
      const icon = { key: "🔑", measure: "Σ", time: "🕒", dimension: "·" };
      h += `<div class="cols">${d.columns.map((c) => `<div>${icon[c.r] || "·"} ${esc(c.n)}</div>`).join("")}</div>`;
      if (d.cols > d.columns.length) h += `<div class="m">+ ${d.cols - d.columns.length} more</div>`;
    }
    h += `<div class="m" style="margin-top:4px">Click to inspect · double-click to focus</div>`;
    return h;
  }
  function linkTip(l) {
    if (l.kind === "rel") {
      let h = `<div class="t">${esc(l.pid)}</div><div class="m">${esc(l.s)} → ${esc(l.t)} · ${esc(l.cardText || l.card)}</div>`;
      if (l.join) h += `<div style="margin-top:4px">${esc(l.join)}</div>`;
      const meta = [];
      if (l.prov) meta.push("provenance: " + l.prov);
      if (l.conf != null) meta.push("confidence " + Math.round(l.conf * 100) + "%");
      if (meta.length) h += `<div class="m">${esc(meta.join(" · "))}</div>`;
      return h;
    }
    if (l.kind === "sug") {
      let h = `<div class="t">Suggested relationship</div><div class="m">${esc(l.s)} → ${esc(l.t)} · ${Math.round((l.conf || 0) * 100)}%</div>`;
      if (l.join) h += `<div style="margin-top:4px">${esc(l.join)}</div>`;
      (l.evidence || []).forEach((e) => { h += `<div class="m">• ${esc(e)}</div>`; });
      return h + `<div class="m" style="margin-top:4px">Select it, then ✓ Accept or ✕ Reject</div>`;
    }
    return `<div class="t">Lineage</div><div class="m">${esc(l.s)} feeds ${esc(l.t)}</div>` +
      `<div>${esc(l.events || 0)} events${l.last ? " · last seen " + esc(l.last) : ""}</div>`;
  }
  function showTip(ev, html) { const t = $("tip"); t.innerHTML = html; t.classList.add("show"); moveTip(ev); }
  function moveTip(ev) {
    const t = $("tip"), r = $("stage").getBoundingClientRect();
    let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14;
    if (x + t.offsetWidth > r.width - 6) x = ev.clientX - r.left - t.offsetWidth - 14;
    if (y + t.offsetHeight > r.height - 6) y = ev.clientY - r.top - t.offsetHeight - 14;
    t.style.left = Math.max(4, x) + "px"; t.style.top = Math.max(4, y) + "px";
  }
  function hideTip() { $("tip").classList.remove("show"); }

  // ------------------------------------------------------------------ search
  function updateHits() {
    const v = $("q").value.trim().toLowerCase();
    st.query = v;
    st.hits = v ? st.nodes.filter((n) => visibleNode(n) && ((n.label || n.id).toLowerCase().indexOf(v) >= 0 ||
      (n.table || "").toLowerCase().indexOf(v) >= 0)).map((n) => n.id) : [];
    $("hits").textContent = v ? (st.hits.length + (st.hits.length === 1 ? " hit" : " hits")) : "";
    applyClasses();
  }
  function runSearch() {
    updateHits();
    if (st.hits.length) {
      const few = st.hits.length <= 6;
      fitView(true, st.nodes.filter((n) => (few && st.hits.indexOf(n.id) >= 0) || n.id === st.hits[0]));
    }
  }

  // ------------------------------------------------------------------ export
  function exportSvgText() {
    const ns = st.nodes.filter(visibleNode).filter((n) => n.x != null);
    const pad = 40;
    const x0 = d3.min(ns, (n) => n.x - n.w / 2) - pad, x1 = d3.max(ns, (n) => n.x + n.w / 2) + pad;
    const y0 = d3.min(ns, (n) => n.y - n.h / 2) - pad, y1 = d3.max(ns, (n) => n.y + n.h / 2) + pad;
    const clone = svg.node().cloneNode(true);
    clone.querySelectorAll(".hitpath").forEach((e) => e.remove());
    clone.querySelector("#gridLayer") && clone.querySelector("#gridLayer").remove();
    const r = clone.querySelector("#root");
    r.removeAttribute("transform");
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    clone.setAttribute("viewBox", `${x0} ${y0} ${x1 - x0} ${y1 - y0}`);
    clone.setAttribute("width", Math.round(x1 - x0));
    clone.setAttribute("height", Math.round(y1 - y0));
    clone.removeAttribute("style");
    const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    bg.setAttribute("x", x0); bg.setAttribute("y", y0); bg.setAttribute("width", x1 - x0); bg.setAttribute("height", y1 - y0);
    bg.setAttribute("fill", (st.dark ? PALETTE.dark : PALETTE.light).bg);
    clone.insertBefore(bg, r);
    return { text: new XMLSerializer().serializeToString(clone), w: x1 - x0, h: y1 - y0 };
  }
  function download(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }
  function exportSvg() {
    if (!st.nodes.length) return;
    download(new Blob([exportSvgText().text], { type: "image/svg+xml" }), "ontology-network.svg");
    status("Downloaded ontology-network.svg");
  }
  function exportPng() {
    if (!st.nodes.length) return;
    const s = exportSvgText(), scale = Math.min(3, 4000 / Math.max(s.w, s.h)) || 2;
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = Math.round(s.w * scale); c.height = Math.round(s.h * scale);
      const ctx = c.getContext("2d"); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
      c.toBlob((b) => { download(b, "ontology-network.png"); status("Downloaded ontology-network.png"); }, "image/png");
    };
    img.onerror = () => status("PNG export failed in this browser; use SVG instead");
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s.text);
  }

  // ------------------------------------------------------------------ init
  function init() {
    svg = d3.select("#graph");
    defs = svg.append("defs");
    styleEl = defs.append("style");
    const flt = defs.append("filter").attr("id", "shadow").attr("x", "-20%").attr("y", "-30%")
      .attr("width", "140%").attr("height", "170%");
    flt.append("feDropShadow").attr("id", "shadowFx").attr("dx", 0).attr("dy", 1.5).attr("stdDeviation", 2.4)
      .attr("flood-color", "#0f172a").attr("flood-opacity", 0.14);
    const pat = defs.append("pattern").attr("id", "gridPattern").attr("patternUnits", "userSpaceOnUse")
      .attr("width", 24).attr("height", 24);
    pat.append("circle").attr("class", "gridDot").attr("cx", 12).attr("cy", 12).attr("r", 1.1);
    svg.append("rect").attr("id", "gridLayer").attr("width", "100%").attr("height", "100%").attr("fill", "url(#gridPattern)");
    root = svg.append("g").attr("id", "root");
    gLinks = root.append("g").attr("class", "links");
    gLabels = root.append("g").attr("class", "labels");
    gNodes = root.append("g").attr("class", "nodes");
    rubber = root.append("path").attr("class", "rubber");
    buildMarkers();

    zoom = d3.zoom().scaleExtent([0.08, 3]).on("zoom", zoomed);
    svg.call(zoom).on("dblclick.zoom", null);
    svg.on("click", () => clickBackground());
    svg.on("dblclick", () => fitView(true));

    mini = d3.select("#mini");
    miniRoot = mini.append("g");
    miniView = mini.append("rect").attr("fill", "rgba(37,99,235,0.08)").attr("stroke", "#2563eb")
      .attr("stroke-width", 1.2).attr("rx", 2);
    mini.on("mousedown", (ev) => { miniNavigate(ev); mini.on("mousemove.nav", miniNavigate); })
      .on("mouseup", () => mini.on("mousemove.nav", null)).on("mouseleave", () => mini.on("mousemove.nav", null));

    sim = d3.forceSimulation().stop();

    $("mSelect").onclick = () => setMode("select");
    $("mConnect").onclick = () => setMode(st.mode === "connect" ? "select" : "connect");
    $("bRepT").onclick = () => setMode("repoint-target");
    $("bRepS").onclick = () => setMode("repoint-source");
    $("bDel").onclick = () => { const l = selectedLink(); if (l && l.kind === "rel") {
      send({ type: "delete", edge: l.pid }); status("Deleting " + l.pid + " …"); } };
    $("bAcc").onclick = () => { const l = selectedLink(); if (l && l.kind === "sug") {
      send({ type: "accept", sid: l.sid }); status("Accepting suggestion …"); } };
    $("bRej").onclick = () => { const l = selectedLink(); if (l && l.kind === "sug") {
      send({ type: "reject", sid: l.sid }); status("Rejecting suggestion …"); } };
    $("layout").onchange = function () { st.layout = this.value; relayout(true); };
    $("bLayout").onclick = () => relayout(true);
    $("bFit").onclick = () => fitView(true);
    $("bIn").onclick = () => svg.transition().duration(220).call(zoom.scaleBy, 1.3);
    $("bOut").onclick = () => svg.transition().duration(220).call(zoom.scaleBy, 1 / 1.3);
    $("bFull").onclick = () => {
      const w = $("wrap");
      if (document.fullscreenElement) document.exitFullscreen();
      else if (w.requestFullscreen) w.requestFullscreen().catch(() => status("Full screen is not available here"));
    };
    document.addEventListener("fullscreenchange", () => {
      $("wrap").style.height = document.fullscreenElement ? "100vh" : st.height + "px";
      setTimeout(() => { fitView(true); }, 120);
    });
    $("bSvg").onclick = exportSvg;
    $("bPng").onclick = exportPng;
    ["tRel", "tSug", "tLin"].forEach((id) => { $(id).onchange = () => { draw(); forces(); }; });
    $("tLbl").onchange = applyClasses;
    $("tMini").onchange = function () { $("mini").classList.toggle("hide", !this.checked); drawMini(); };
    $("legHd").onclick = () => { $("legend").classList.toggle("min");
      $("legHd").textContent = $("legend").classList.contains("min") ? "Legend ▸" : "Legend ▾"; };
    $("q").oninput = runSearch;
    document.addEventListener("keydown", (ev) => {
      if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT") {
        if (ev.key === "Escape") { ev.target.value = ""; runSearch(); ev.target.blur(); }
        return;
      }
      if (ev.key === "Escape") { setMode("select"); st.sel = null; applyClasses(); }
      else if (ev.key === "Delete" || ev.key === "Backspace") $("bDel").click();
      else if (ev.key === "c" || ev.key === "C") $("mConnect").click();
      else if (ev.key === "f" || ev.key === "F") fitView(true);
      else if (ev.key === "l" || ev.key === "L") relayout(true);
      else if (ev.key === "/") { ev.preventDefault(); $("q").focus(); }
    });
    window.addEventListener("resize", () => drawMini());
    window.__graph = st;          // handy for debugging and automated UI tests
    window.__sim = () => sim;
    window.__exportSvg = () => exportSvgText().text;
    setMode("select");
  }

  // ------------------------------------------------------------------ render (called on every Streamlit rerun)
  function render(args) {
    st.height = args.height || 640;
    const dark = !!args.dark;
    document.body.classList.toggle("dark", dark);
    $("wrap").style.height = (document.fullscreenElement ? window.innerHeight : st.height) + "px";
    post("streamlit:setFrameHeight", { height: st.height + 2 });
    if (!svg) {
      init();
      if (st.height < 560) { $("legend").classList.add("min"); $("legHd").textContent = "Legend ▸"; }
    }
    if (dark !== st.dark || !styleEl.text()) {
      st.dark = dark; styleEl.text(svgCss(dark)); buildMarkers();
      svg.select("#shadowFx").attr("flood-color", dark ? "#000000" : "#0f172a").attr("flood-opacity", dark ? 0.55 : 0.14);
      miniView.attr("stroke", dark ? "#60a5fa" : "#2563eb");
    }
    const g = args.graph || { nodes: [], links: [] }, pos = args.positions || {};

    // ---- nodes: keep objects (and positions) across reruns
    const next = new Map();
    let missing = 0;
    (g.nodes || []).forEach((raw) => {
      const old = st.byId.get(raw.id);
      const n = old || {};
      Object.keys(n).forEach((k) => { if (!/^(x|y|vx|vy|fx|fy|index|_.*)$/.test(k)) delete n[k]; });
      Object.assign(n, raw);
      size(n);
      if (!old) {
        const p = pos[raw.id];
        if (p && isFinite(p.x) && isFinite(p.y)) { n.x = n.fx = p.x; n.y = n.fy = p.y; }
        else { missing++; n._new = true; }
      }
      next.set(raw.id, n);
    });
    st.nodes = Array.from(next.values());
    st.byId = next;
    st.links = (g.links || []).filter((l) => next.has(l.source) && next.has(l.target))
      .map((l) => Object.assign({}, l, { s: l.source, t: l.target, source: next.get(l.source), target: next.get(l.target) }));
    computeOffsets();
    computeLayers();

    // ---- new classes start next to a placed neighbour
    st.nodes.filter((n) => n._new).forEach((n) => {
      const nb = st.links.map((l) => (l.s === n.id ? l.target : l.t === n.id ? l.source : null))
        .filter((m) => m && !m._new && m.x != null);
      if (nb.length) {
        n.x = d3.mean(nb, (m) => m.x) + (Math.random() - 0.5) * 160;
        n.y = d3.mean(nb, (m) => m.y) + (Math.random() - 0.5) * 160;
      } else if (st.nodes.some((m) => !m._new && m.x != null)) {
        const placed = st.nodes.filter((m) => !m._new && m.x != null);
        n.x = d3.max(placed, (m) => m.x) + 220; n.y = d3.mean(placed, (m) => m.y) + (Math.random() - 0.5) * 200;
      }
    });
    sim.nodes(st.nodes);
    draw();
    forces();
    const total = st.nodes.length;
    if (st.first && total) {
      st.first = false;
      if (missing > total / 2) { st.nodes.forEach((n) => { n._new = false; }); relayout(true, true); }
      else {
        if (missing) settleNew();
        fitView(false);
      }
    } else if (missing) {
      settleNew();
    }
    st.nodes.forEach((n) => { n._new = false; });

    // ---- selection from the inspector (Python is the source of truth after a rerun)
    const s = args.selected || {};
    if (s.kind === "node" && next.has(s.id)) st.sel = { type: "node", id: s.id };
    else if (s.kind === "edge" && st.links.some((l) => l.id === s.id)) st.sel = { type: "link", id: s.id };
    else if (!s.kind) st.sel = null;
    if (st.query) updateHits(); else applyClasses();
    if (args.message) status(args.message);
  }

  window.addEventListener("message", (ev) => {
    if (ev.data && ev.data.type === "streamlit:render") render(ev.data.args || {});
  });
  post("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
